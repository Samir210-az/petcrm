<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8"><title>Heyvan Kartı - PET CRM</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="container">
  <div class="header"><div><h2>Heyvan Kartı</h2></div><button onclick="history.back()" style="width:auto; background:#777;">← Geri</button></div>
  <div id="petInfo" class="card">Yüklənir...</div>
  <div class="card">
    <h3>+ Yeni Heyvan Əlavə Et</h3>
    <input id="petNameInput" placeholder="Heyvanın adı: Bella">
    <input id="ownerNameInput" placeholder="Sahibin adı">
    <input id="ownerPhoneInput" placeholder="Telefon: 0501234567">
    <button onclick="addPet()">Yadda Saxla</button>
  </div>
</div>
<script type="module">
  import { db, ref, get, child, push, set } from './assets/firebase.js';
  const petId = new URLSearchParams(window.location.search).get('id');
  const businessId = localStorage.getItem('userId');

  if (petId) {
    get(child(ref(db), `pets/${petId}`)).then((snapshot) => {
      if (snapshot.exists()) {
        const pet = snapshot.val();
        document.getElementById('petInfo').innerHTML = `
          <div class="pet-card"><div class="pet-photo"></div><div>
          <h2>${pet.name} <span class="badge">${pet.breed || ''}</span></h2>
          <p><b>Sahibi:</b> ${pet.ownerName}</p>
          <p><b>Telefon:</b> <span id="ownerPhone">${pet.ownerPhone}</span></p>
          </div></div>
          <div class="menu">
          <button onclick="sendWhatsApp('${pet.ownerPhone}', 'peyvend', '${pet.name}')">📲 Peyvənd Xatırlat</button>
          <button onclick="sendWhatsApp('${pet.ownerPhone}', 'yem', '${pet.name}')">📲 Yem Təklifi Göndər</button>
          </div>`;
      }
    });
  } else {
    document.getElementById('petInfo').innerHTML = '<p>Yeni heyvan əlavə etmək üçün formu doldurun</p>';
  }

  window.addPet = () => {
    const newPetRef = push(ref(db, 'pets'));
    set(newPetRef, {
      businessId: businessId,
      id: newPetRef.key,
      name: document.getElementById('petNameInput').value,
      ownerName: document.getElementById('ownerNameInput').value,
      ownerPhone: document.getElementById('ownerPhoneInput').value,
      createdAt: Date.now()
    }).then(() => {
      alert('Heyvan əlavə olundu!');
      location.reload();
    });
  }

  window.sendWhatsApp = (phone, type, petName) => {
    let cleanPhone = phone.replace(/\D/g, '');
    if (cleanPhone.startsWith('0')) cleanPhone = '994' + cleanPhone.substring(1);
    let msg = type === 'peyvend'
      ? `Salam! ${petName} üçün peyvənd vaxtı yaxınlaşır. 3 gün ərzində müraciət edin ❤️ - PET CRM`
      : `Salam! ${petName} üçün yem 2 günə qurtarır. Sizin üçün saxlamışıq 🛍️ - PET CRM`;
    window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
  }
</script>
</body>
</html>
