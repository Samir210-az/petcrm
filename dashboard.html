<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8"><title>Dashboard - PET CRM</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="container">
  <div class="header">
    <div><h2>PET CRM</h2><p id="roleTitle"></p></div>
    <div style="display:flex; gap:10px;">
      <button id="teamBtn" onclick="window.location.href='team.html'" style="width:auto; display:none;">👥 Komandam</button>
      <button onclick="window.location.href='pet-card.html'" style="width:auto;">+ Yeni Heyvan</button>
    </div>
  </div>
  <div class="card">
    <h3>🚨 Smart Xəbərdarlıqlar</h3>
    <div id="alertsList">Yüklənir...</div>
  </div>
  <div class="card" id="posCard" style="display:none;">
    <h3>💰 Tez Satış - POS</h3>
    <button onclick="window.location.href='pos.html'">POS Ekranını Aç</button>
  </div>
</div>
<script type="module">
  import { db, auth, ref, get, onValue, onAuthStateChanged } from './assets/firebase.js';

  function isPlanValid(business) {
    if (!business) return false;
    if (business.plan === 'active') {
      return !business.expiresAt || Date.now() < business.expiresAt;
    }
    if (business.plan === 'trial') {
      return Date.now() < business.expiresAt;
    }
    return false;
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'index.html';
      return;
    }

    const userSnap = await get(ref(db, `users/${user.uid}`));
    if (!userSnap.exists()) {
      window.location.href = 'index.html';
      return;
    }

    const userInfo = userSnap.val();
    const businessSnap = await get(ref(db, `businesses/${userInfo.businessId}`));
    const business = businessSnap.val();

    if (!isPlanValid(business)) {
      window.location.href = 'index.html';
      return;
    }

    initDashboard(business, userInfo);
  });

  const ROLE_LABELS = { baytar: 'Baytar', resepshn: 'Resepşn', laborant: 'Laborant', diger: 'İşçi' };

  function initDashboard(business, userInfo) {
    let titleText = business.businessType === 'magaza' ? 'Zoomağaza Paneli' : 'Baytar Klinikası Paneli';
    if (!userInfo.isOwner) {
      titleText += ` — ${ROLE_LABELS[userInfo.staffRole] || 'İşçi'}`;
    }
    document.getElementById('roleTitle').innerText = titleText;

    if (business.businessType === 'magaza') document.getElementById('posCard').style.display = 'block';
    if (userInfo.isOwner) document.getElementById('teamBtn').style.display = 'inline-block';

    const alertsRef = ref(db, 'alerts/');
    onValue(alertsRef, (snapshot) => {
      const data = snapshot.val(); let html = '';
      for (let id in data) { html += `<div class="alert" onclick="window.location.href='pet-card.html?id=${data[id].petId}'">${data[id].text}</div>`; }
      document.getElementById('alertsList').innerHTML = html || 'Xəbərdarlıq yoxdur';
    });
  }
</script>
</body>
</html>
